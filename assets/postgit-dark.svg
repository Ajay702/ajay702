<svg xmlns="http://www.w3.org/2000/svg" width="800" height="452" viewBox="0 0 800 452" role="img" aria-label="PostGit"><style>.flow{stroke-dasharray:5 7;animation:dash 1.1s linear infinite}.pop{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style><defs>
