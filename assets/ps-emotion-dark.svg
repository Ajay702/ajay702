<svg xmlns="http://www.w3.org/2000/svg" width="600" height="452" viewBox="0 0 600 452" role="img" aria-label="PS5 Play"><style>.d0{animation:d0 3.0s ease-in-out infinite alternate}@keyframes d0{from{width:80px}to{width:160px}}.d1{animation:d1 3.6s ease-in-out infinite alternate}@keyframes d1{from{width:45px}to{width:90px}}.d2{animation:d2 4.2s ease-in-out infinite alternate}@keyframes d2{from{width:90px}to{width:180px}}.d3{animation:d3 4.8s ease-in-out infinite alternate}@keyframes d3{from{width:30px}to{width:60px}}</style><defs>
