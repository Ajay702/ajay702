<svg xmlns="http://www.w3.org/2000/svg" width="400" height="452" viewBox="0 0 400 452" role="img" aria-label="jobpipe"><style>.flow{stroke-dasharray:4 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}.n{animation:pulse 5s infinite}@keyframes pulse{0%,100%{fill-opacity:.12}8%{fill-opacity:.55}20%{fill-opacity:.12}}</style><defs>
