<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="voice-first-demo"><style></style><defs>
  <clipPath id="clip"><rect width="400" height="300" rx="22"/></clipPath>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9DCE3"/></pattern>
  <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#F472B6" stop-opacity="0.16"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
  <linearGradient id="dotfade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
  <mask id="dm"><rect width="400" height="300" fill="url(#dotfade)"/></mask>
</defs>
<g clip-path="url(#clip)">
  <rect width="400" height="300" fill="#F7F7F9"/>
  <rect width="400" height="300" fill="url(#dots)" mask="url(#dm)" opacity=".7"/>
  <rect width="400" height="300" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="399" height="299" rx="22" fill="none" stroke="#E3E5EA"/>
<text x="374" y="112" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="76" font-weight="700" fill="#F472B6" fill-opacity=".16">◉</text>
<rect x="28" y="35" width="107" height="24" rx="12" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".45"/><circle cx="41" cy="47" r="3.5" fill="#F472B6"/><text x="50" y="51" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#BE185D" letter-spacing=".6">OPEN SOURCE</text>
<text x="26" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#14161B" letter-spacing="-.6">voice-first-demo</text>
<text x="28" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5E6472">JavaScript · Playwright</text>
<text x="28" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15" fill="#5E6472">Record your voice first; the screen</text><text x="28" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15" fill="#5E6472">recording builds itself around your timing.</text>
<rect x="28" y="248" width="344" height="1" fill="#E3E5EA"/>
<text x="28" y="276" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-style="italic" font-size="16" fill="#BE185D">the screen follows you</text>
<text x="372" y="276" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#5E6472">↗</text>
</svg>