<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Ajay Raghav — AI engineer"><style>.rot{transform-origin:930px 250px;animation:r 40s linear infinite}.cr{animation:r 40s linear infinite reverse}@keyframes r{to{transform:rotate(360deg)}}.core{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}.in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.blink{animation:bk 1.1s step-end infinite}@keyframes bk{50%{opacity:0}}</style><defs>
  <clipPath id="clip"><rect width="1200" height="500" rx="28"/></clipPath>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9DCE3"/></pattern>
