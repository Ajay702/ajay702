  <linearGradient id="dotfade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
  <mask id="dm"><rect width="1200" height="500" fill="url(#dotfade)"/></mask>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="500" fill="#F7F7F9"/>
  <rect width="1200" height="500" fill="url(#dots)" mask="url(#dm)" opacity=".7"/>
  <rect width="1200" height="500" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="1199" height="499" rx="28" fill="none" stroke="#E3E5EA"/>
<defs><radialGradient id="g2" cx=".05" cy=".05" r=".6"><stop offset="0" stop-color="#4ADE80" stop-opacity="0.11"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="500" rx="28" fill="url(#g2)"/>
