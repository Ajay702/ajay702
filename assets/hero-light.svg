  <text x="64" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="19" fill="#5E6472">RAG pipelines, agents, LLM evals and the full-stack systems around them.</text>
</g>
<text x="64" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#14161B" letter-spacing="-1">56</text><text x="64" y="454" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5E6472">repositories</text><text x="234" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#14161B" letter-spacing="-1">2</text><text x="234" y="454" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5E6472">AI products, solo</text><rect x="214" y="400" width="1" height="58" fill="#E3E5EA"/><text x="404" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#14161B" letter-spacing="-1">2022</text><text x="404" y="454" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5E6472">shipping since</text><rect x="384" y="400" width="1" height="58" fill="#E3E5EA"/>
