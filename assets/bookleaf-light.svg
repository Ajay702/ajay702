<svg xmlns="http://www.w3.org/2000/svg" width="800" height="452" viewBox="0 0 800 452" role="img" aria-label="BookLeaf Portal"><style>.tk{opacity:0;animation:in .5s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}.blink{animation:b 1.6s ease-in-out infinite}@keyframes b{50%{opacity:.35}}</style><defs>
  <clipPath id="clip"><rect width="800" height="452" rx="24"/></clipPath>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#D9DCE3"/></pattern>
  <radialGradient id="glow" cx="0" cy="1" r=".9"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  <linearGradient id="dotfade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
  <mask id="dm"><rect width="800" height="452" fill="url(#dotfade)"/></mask>
</defs>
<g clip-path="url(#clip)">
  <rect width="800" height="452" fill="#F7F7F9"/>
  <rect width="800" height="452" fill="url(#dots)" mask="url(#dm)" opacity=".7"/>
  <rect width="800" height="452" fill="url(#glow)"/>
</g>
